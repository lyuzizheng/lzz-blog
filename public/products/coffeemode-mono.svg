<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Mono Halftone Dot Pattern (Screen Angle 45deg, Cobalt Ink) -->
    <pattern id="mono-halftone-cm" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2.5" cy="2.5" r="1.3" fill="#2148B8" fill-opacity="0.32" />
      <circle cx="8.5" cy="8.5" r="1.3" fill="#2148B8" fill-opacity="0.32" />
    </pattern>
    <!-- Dense Halftone for Shaded Mechanical Zones -->
    <pattern id="mono-dense-cm" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="1.6" fill="#2148B8" fill-opacity="0.48" />
      <circle cx="6" cy="6" r="1.6" fill="#2148B8" fill-opacity="0.48" />
    </pattern>
  </defs>

  <!-- Substrate: Pale Beige Paper Base (#F5F1E8) -->
  <rect width="800" height="500" fill="#F5F1E8" />

  <!-- Outer Boundary & Registration Trim Marks -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#2148B8" stroke-width="1" stroke-opacity="0.4" />
  <rect x="28" y="28" width="744" height="444" fill="none" stroke="#2148B8" stroke-width="0.5" stroke-opacity="0.2" />

  <!-- Corner Crop Marks (1px Hairlines) -->
  <path d="M12 24h20M24 12v20 M768 24h20M776 12v20 M12 476h20M24 468v20 M768 476h20M776 468v20" stroke="#2148B8" stroke-width="1" />

  <!-- Telemetry Header Strip -->
  <g font-family="monospace" font-size="9" fill="#2148B8" letter-spacing="1">
    <text x="40" y="46">PLATE 01 // COFFEEMODE</text>
    <text x="280" y="46">SPEC // 0000-FOUNDER-MANIFESTO</text>
    <text x="580" y="46">LAT 01°17'58"N · LON 103°51'08"E</text>
    <line x1="40" y1="52" x2="760" y2="52" stroke="#2148B8" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- Background Halftone Region (Architectural Plot Zone) -->
  <rect x="50" y="70" width="310" height="370" fill="url(#mono-halftone-cm)" />
  <rect x="50" y="70" width="310" height="370" fill="none" stroke="#2148B8" stroke-width="1" />

  <!-- LEFT SCHEMATIC: Precision Portafilter & Extraction Geometry -->
  <g transform="translate(70, 95)">
    <!-- Section Title -->
    <text x="0" y="14" font-family="monospace" font-size="10" font-weight="bold" fill="#2148B8">FIG 01.1 · EXTRACTION SCHEMATIC</text>
    <text x="0" y="27" font-family="monospace" font-size="8" fill="#1A1A18" fill-opacity="0.7">CALIBRATED: 9.0 BAR / 93.5°C / 1:2 RATIO</text>

    <!-- Center Line Axis -->
    <line x1="135" y1="35" x2="135" y2="280" stroke="#2148B8" stroke-width="0.75" stroke-dasharray="4,3" stroke-opacity="0.6" />

    <!-- Grouphead Collar -->
    <rect x="65" y="50" width="140" height="18" fill="#F5F1E8" stroke="#2148B8" stroke-width="1.5" />
    <line x1="75" y1="56" x2="195" y2="56" stroke="#2148B8" stroke-width="0.75" />
    <line x1="75" y1="62" x2="195" y2="62" stroke="#2148B8" stroke-width="0.75" />

    <!-- Portafilter Basket Body -->
    <path d="M75 68 h120 l-12 55 c-2 9 -10 16 -20 16 h-56 c-10 0 -18 -7 -20 -16 z" fill="#F5F1E8" stroke="#2148B8" stroke-width="1.5" />
    <!-- Basket Halftone Fill (Ground Coffee Bed) -->
    <path d="M82 74 h106 l-8 38 c-1 5 -6 9 -12 9 h-66 c-6 0 -11 -4 -12 -9 z" fill="url(#mono-dense-cm)" stroke="#2148B8" stroke-width="0.75" />

    <!-- Spout (Dual Drip) -->
    <path d="M125 139 v18 l-10 14" fill="none" stroke="#2148B8" stroke-width="1.5" />
    <path d="M145 139 v18 l10 14" fill="none" stroke="#2148B8" stroke-width="1.5" />

    <!-- Handle (Left Projection) -->
    <path d="M65 54 h-50 c-5 0 -8 4 -8 9 v4 c0 5 3 9 8 9 h50" fill="#F5F1E8" stroke="#2148B8" stroke-width="1.5" />
    <line x1="15" y1="60" x2="55" y2="60" stroke="#2148B8" stroke-width="0.75" />
    <line x1="15" y1="68" x2="55" y2="68" stroke="#2148B8" stroke-width="0.75" />

    <!-- Extraction Stream Lines -->
    <path d="M115 171 v40 M155 171 v40" stroke="#2148B8" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Laboratory Glass / Cup Receiver -->
    <path d="M95 215 h80 l6 45 c1 6 -3 11 -9 11 h-74 c-6 0 -10 -5 -9 -11 z" fill="#F5F1E8" stroke="#2148B8" stroke-width="1.5" />
    <!-- Volume Graduations -->
    <line x1="103" y1="230" x2="118" y2="230" stroke="#2148B8" stroke-width="0.75" />
    <line x1="105" y1="242" x2="122" y2="242" stroke="#2148B8" stroke-width="1.2" />
    <line x1="107" y1="254" x2="118" y2="254" stroke="#2148B8" stroke-width="0.75" />
    <text x="126" y="244" font-family="monospace" font-size="7" fill="#2148B8">36g YIELD</text>

    <!-- Dimension Bracket (Right) -->
    <path d="M215 68 h10 v71 h-10" fill="none" stroke="#2148B8" stroke-width="0.75" />
    <text x="230" y="106" font-family="monospace" font-size="8" fill="#2148B8" transform="rotate(90 230 106)">58.5mm</text>
  </g>

  <!-- RIGHT SCHEMATIC: Cafe Space Radar & Laptop-Friendly Blueprint -->
  <g transform="translate(385, 70)">
    <!-- Blueprint Container Box -->
    <rect x="0" y="0" width="375" height="370" fill="none" stroke="#2148B8" stroke-width="1" />
    <rect x="4" y="4" width="367" height="24" fill="#F5F1E8" stroke="#2148B8" stroke-width="0.75" />
    <text x="12" y="20" font-family="monospace" font-size="10" font-weight="bold" fill="#2148B8">FIG 01.2 · SPACE RADAR &amp; LAPTOP-FRIENDLY METER</text>

    <!-- Radar Circle Grid (Radial Compass) -->
    <g transform="translate(185, 140)">
      <circle cx="0" cy="0" r="85" fill="none" stroke="#2148B8" stroke-width="0.75" stroke-dasharray="3,3" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="55" fill="none" stroke="#2148B8" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="0" cy="0" r="25" fill="none" stroke="#2148B8" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#2148B8" />

      <!-- Coordinate Crosshairs -->
      <line x1="-95" y1="0" x2="95" y2="0" stroke="#2148B8" stroke-width="0.75" stroke-opacity="0.7" />
      <line x1="0" y1="-95" x2="0" y2="95" stroke="#2148B8" stroke-width="0.75" stroke-opacity="0.7" />

      <!-- Discovery Vector Sweep -->
      <path d="M0 0 L60 -60 A85 85 0 0 1 85 0 Z" fill="url(#mono-halftone-cm)" stroke="#2148B8" stroke-width="0.75" />

      <!-- Verified POI Pins (Discovered Specialty Cafes) -->
      <g transform="translate(42, -35)">
        <circle cx="0" cy="0" r="4" fill="#2148B8" />
        <text x="7" y="3" font-family="monospace" font-size="8" font-weight="bold" fill="#2148B8">POI: 01</text>
      </g>
      <g transform="translate(-48, -42)">
        <circle cx="0" cy="0" r="4" fill="#2148B8" />
        <text x="-38" y="3" font-family="monospace" font-size="8" font-weight="bold" fill="#2148B8">POI: 02</text>
      </g>
      <g transform="translate(30, 50)">
        <circle cx="0" cy="0" r="4" fill="#2148B8" />
        <text x="7" y="3" font-family="monospace" font-size="8" font-weight="bold" fill="#2148B8">POI: 03</text>
      </g>
    </g>

    <!-- Signal Metrics Panel (Bottom of Box) -->
    <rect x="15" y="245" width="345" height="110" fill="#F5F1E8" stroke="#2148B8" stroke-width="1" />
    <rect x="15" y="245" width="345" height="20" fill="url(#mono-halftone-cm)" stroke="#2148B8" stroke-width="0.75" />
    <text x="24" y="259" font-family="monospace" font-size="8.5" font-weight="bold" fill="#2148B8">DESK TELEMETRY · 3-SECOND GATE</text>

    <!-- Laptop Signal Row -->
    <g transform="translate(25, 275)">
      <!-- Mini Laptop Vector Icon -->
      <rect x="0" y="0" width="18" height="12" rx="1" fill="none" stroke="#2148B8" stroke-width="1" />
      <line x1="-3" y1="14" x2="21" y2="14" stroke="#2148B8" stroke-width="1.5" />
      <text x="28" y="10" font-family="monospace" font-size="8.5" fill="#1A1A18">POWER PLUG: <tspan font-weight="bold" fill="#2148B8">AVAILABLE (100W TYPE-C)</tspan></text>
    </g>

    <!-- WiFi / Speed Row -->
    <g transform="translate(25, 298)">
      <!-- WiFi Wave Vectors -->
      <path d="M2 10 A10 10 0 0 1 16 10 M5 12 A6 6 0 0 1 13 12 M9 14 a1 1 0 1 1 0 0.1" fill="none" stroke="#2148B8" stroke-width="1.2" />
      <text x="28" y="11" font-family="monospace" font-size="8.5" fill="#1A1A18">SEATS &amp; LIGHT: <tspan font-weight="bold" fill="#2148B8">NATURAL DAYLIGHT / ERGO DESK</tspan></text>
    </g>

    <!-- 3s Check-in Speed Bar -->
    <g transform="translate(25, 322)">
      <!-- Stopwatch Icon -->
      <circle cx="9" cy="8" r="7" fill="none" stroke="#2148B8" stroke-width="1" />
      <line x1="9" y1="1" x2="9" y2="4" stroke="#2148B8" stroke-width="1" />
      <line x1="9" y1="8" x2="13" y2="6" stroke="#2148B8" stroke-width="1.2" />
      <text x="28" y="11" font-family="monospace" font-size="8.5" fill="#1A1A18">FAST CHECK-IN: <tspan font-weight="bold" fill="#2148B8">&lt; 3.0s (ZERO AD / ZERO NAG)</tspan></text>
    </g>
  </g>

  <!-- Technical Stamp Badge: Bottom Right -->
  <g transform="translate(565, 412)">
    <rect x="0" y="0" width="190" height="34" fill="#F5F1E8" stroke="#2148B8" stroke-width="1.5" />
    <rect x="2" y="2" width="186" height="30" fill="none" stroke="#2148B8" stroke-width="0.5" stroke-dasharray="2,2" />
    <text x="10" y="15" font-family="monospace" font-size="8" font-weight="bold" fill="#2148B8">STATUS: IN_DEVELOPMENT</text>
    <text x="10" y="27" font-family="monospace" font-size="7.5" fill="#1A1A18">REPO: LYUZIZHENG/COFFEEMODE</text>
  </g>

  <!-- Footer Technical Annotation -->
  <g font-family="monospace" font-size="8" fill="#2148B8" fill-opacity="0.8">
    <text x="40" y="466">ARCHETYPE: SPECIALTY COFFEE DISCOVERY ENGINE · GEOMETRIC DESK METER</text>
    <text x="640" y="466">MONO-COLOR PURE PRINT</text>
  </g>
</svg>
