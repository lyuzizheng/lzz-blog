name: lzz-blog CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gate & Edge Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Verification Test Suite
        run: pnpm test

      - name: Build Next.js & OpenNext Cloudflare Worker
        run: pnpm build:worker

      - name: Validate Cloudflare Pages Static Assets
        run: pnpm pages:validate

      - name: Verify Wrangler Binding Types
        run: pnpm cf-typegen

  deploy:
    name: Cloudflare Edge Deployment
    needs: quality
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js & Cloudflare Edge Bundle
        run: pnpm build:worker

      - name: Deploy to Cloudflare Workers
        id: deploy_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'bf69da5249b63731ad79545d0095e8db' }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in repository secrets! Please configure it in GitHub Settings -> Secrets -> Actions."
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-bf69da5249b63731ad79545d0095e8db}"
          echo "🚀 Deploying to Cloudflare Workers with OpenNext Assets (Account: ${CLOUDFLARE_ACCOUNT_ID})..."
          npx opennextjs-cloudflare deploy

      - name: Verify Edge Deployment Health
        run: |
          echo "🔎 Verifying edge health on production domain..."
          node scripts/cf-health-check.mjs --url https://www.brabalawuka.cc --retries 3 --delay 2000
