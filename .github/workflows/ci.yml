name: lzz-blog CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gate & Edge Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Verification Test Suite
        run: pnpm test

      - name: Build Next.js & OpenNext Cloudflare Worker
        run: pnpm build:worker

      - name: Validate Cloudflare Pages Static Assets
        run: pnpm pages:validate

      - name: Verify Wrangler Binding Types
        run: pnpm cf-typegen

  deploy:
    name: Cloudflare Edge Deployment & Health Check
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-Deployment Connectivity Probe
        run: |
          echo "🔍 Running pre-deployment connectivity probe..."
          node scripts/cf-health-check.mjs --url https://www.brabalawuka.cc --retries 2 --delay 1000 || {
            echo "⚠️ Pre-deployment probe noted baseline state; proceeding with deployment."
          }

      - name: Build Next.js & Cloudflare Edge Bundle
        run: pnpm build:worker

      - name: Deploy to Cloudflare Workers
        id: deploy_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set in repository secrets. Deployment skipped (production deployment managed via Cloudflare MCP pipeline)."
            exit 0
          fi
          echo "🚀 Deploying to Cloudflare Workers with OpenNext Assets..."
          npx opennextjs-cloudflare deploy

      - name: Post-Deployment Zero-Downtime Health Check Probe
        id: post_health_check
        run: |
          echo "🔎 Running post-deployment health check on production custom domain..."
          node scripts/cf-health-check.mjs --url https://www.brabalawuka.cc --retries 5 --delay 3000

      - name: Automated Rollback on Probe Failure
        if: failure() && steps.deploy_worker.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚨 Post-deployment health check failed! Triggering automated rollback..."
          npx wrangler rollback || echo "⚠️ Rollback command exited with warning."
